apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  DATABASE_URL: "postgresql://weather_user:weather_password@postgres.weathergpt.svc.cluster.local:5432/weather_gpt"
  GEMINI_API_KEY: "replace_with_actual_gemini_key"
  OPENAI_API_KEY: "replace_with_actual_openai_key"
  MOSDAC_API_KEY: "replace_with_actual_mosdac_token"
  CDS_API_KEY: "replace_with_actual_cds_key"
