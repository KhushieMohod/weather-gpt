apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weathergpt-ingress
  namespace: weathergpt
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "weathergpt-service"
spec:
  rules:
    - host: weathergpt.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weathergpt-service
                port:
                  number: 80
